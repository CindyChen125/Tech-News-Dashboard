name: Update news

on:
  schedule:
    # Every 30 min, offset from :00 when GitHub's scheduler is most congested.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

# Never run two updates at once — they'd race to commit news.json.
concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run fetch

      - name: Commit updated news
        id: commit
        run: |
          git add public/data data/archive
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update news"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: npm run build

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
